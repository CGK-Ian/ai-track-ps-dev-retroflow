name: Java CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verification
        run: mvn -B verify

      - name: Extract JaCoCo coverage percentage
        id: coverage
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('target/site/jacoco/jacoco.xml') != '' }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          xml_path = 'target/site/jacoco/jacoco.xml'
          root = ET.parse(xml_path).getroot()
          line_counter = root.find("./counter[@type='LINE']")

          if line_counter is None:
              raise SystemExit("No LINE coverage counter found in JaCoCo XML output.")

          missed = float(line_counter.get('missed', 0))
          covered = float(line_counter.get('covered', 0))
          total = covered + missed
          percentage = (covered / total * 100) if total else 0.0

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'percentage={percentage:.2f}\n')

          print(f'Coverage: {percentage:.2f}%')
          PY

      - name: Fail the build if coverage is below 80%
        if: ${{ always() && github.event_name == 'pull_request' && steps.coverage.outputs.percentage != '' }}
        env:
          COVERAGE_PERCENTAGE: ${{ steps.coverage.outputs.percentage }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys

          percentage = float(os.environ['COVERAGE_PERCENTAGE'])
          if percentage < 80.0:
              raise SystemExit(f"Coverage {percentage:.2f}% is below the required 80.00% threshold.")

          print(f"Coverage check passed: {percentage:.2f}%")
          PY

      - name: Comment coverage on pull request
        if: ${{ always() && github.event_name == 'pull_request' && steps.coverage.outputs.percentage != '' }}
        uses: actions/github-script@v8
        with:
          script: |
            const percentage = '${{ steps.coverage.outputs.percentage }}';
            const body = `## Coverage report\n\nTest coverage: **${percentage}%**`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
